METHOD:
  NAME: ClipAdapters
  FAMILY: adapter
  EXEC_MODE: cache
  TAG: LPPLUSPLUS

DATASET:
  MERGE_VAL_TO_TRAIN: true
  DROP_VAL_AFTER_MERGE: false


CLIP_ADAPTERS:
  PREC: amp
  TYPE: MP
  INIT: LP_PLUS_PLUS
  CONSTRAINT: none
  ENHANCED_BASE: none
  ALLOW_CACHE: true

  GRID_SEARCH: false
  GRID_SEARCH_SPLIT: val

  # LP++ works on pre-extracted CLIP features. Using pool+augmentation keeps it
  # compatible with your CLAP/ClipAdapters cache executor.
  CACHE_REPS: 20
  CACHE_TRAIN_AUG: true
  CACHE_AGGREGATION: pool
  CACHE_POOL_EPOCH_SUBSAMPLE: true

  # LP++ branch.
  LPPLUS_USE_BIAS: true
  LPPLUS_TEXT_SCALE: 1.0
  LPPLUS_ALPHA_TRAINABLE: true

  # Keeps the effective visual/alpha step sizes close to the LP++ data-driven
  # rates while still using the existing trainer optimizer.
  LPPLUS_USE_DATA_LR_HOOKS: true
  LPPLUS_GRAD_SCALE_CLIP: 10000.0

