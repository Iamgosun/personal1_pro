METHOD:
  NAME: ClipAdapters
  FAMILY: adapter
  TAG: TipA-f-

DATASET:
  MERGE_VAL_TO_TRAIN: false
  DROP_VAL_AFTER_MERGE: false



CLIP_ADAPTERS:
  PREC: amp
  TYPE: MP
  INIT: TipA-f-
  CONSTRAINT: none
  ENHANCED_BASE: none
  ALLOW_CACHE: true

  # Official Tip-Adapter-F behavior:
  # - train cache keys
  # - use normalized query-cache affinity
  # - keep train-time alpha/beta fixed
  CLAP_TIPA_TRAINABLE_CACHE: true
  CLAP_TIPA_RAW_AFFINITY: false
  CLAP_TIPA_ONE_EPOCH: true
  TIPA_F_GRID_EPOCHS: 20

  TIPA_ALPHA: 1.0
  TIPA_BETA: 1.0
  TIPA_TRAIN_ALPHA: 1.0
  TIPA_TRAIN_BETA: 1.0
  TIPA_CACHE_VALUES_FP16: true

  # Use cache mode to make these effective.
  CACHE_REPS: 20
  CACHE_TRAIN_AUG: true
  CACHE_AGGREGATION: mean
  CACHE_POOL_EPOCH_SUBSAMPLE: false

# Use adam for broad Dassl compatibility. Official implementation uses AdamW.
OPTIM:
  NAME: "adam"
  LR: 0.001
  MAX_EPOCH: 20
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 0
  WEIGHT_DECAY: 0.0

HPO:
  ENABLED: true
  SPLIT: val
  REQUIRE_VAL: true
  SELECTOR: acc
  ACC_TOLERANCE: 0.5

  SKIP_CANDIDATE_TEST: true
  FINAL_TEST_BEST: true
  TRAIN_FINAL_WITH_BEST: false
  COPY_BEST_MODEL: true
  SAVE_SUMMARY: true
  DELETE_NON_BEST_CANDIDATE_MODELS: true

  GRID:
    lr:
      PATH: OPTIM.LR
      VALUES: [0.001]

    alpha:
      PATH: CLIP_ADAPTERS.TIPA_ALPHA
      VALUES: [1.0,11.0, 21.0,  31.0,  41.0]

    beta:
      PATH: CLIP_ADAPTERS.TIPA_BETA
      VALUES: [1.0, 6.6,  12.2,  17.8,  23.4]
