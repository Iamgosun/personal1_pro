METHOD:
  NAME: ClipAdapters
  FAMILY: adapter
  TAG: TipA-f-

CLIP_ADAPTERS:
  PREC: amp
  TYPE: MP
  INIT: TipA-f-
  CONSTRAINT: none
  ENHANCED_BASE: none
  ALLOW_CACHE: true

  # CLAP-aligned TipA-f switches.
  CLAP_TIPA_TRAINABLE_CACHE: true
  CLAP_TIPA_RAW_AFFINITY: true
  CLAP_TIPA_ONE_EPOCH: true
  TIPA_F_GRID_EPOCHS: 20

  # Values overwritten by HPO candidates.
  TIPA_ALPHA: 1.0
  TIPA_BETA: 1.0

  # Keep the support cache CLAP-compatible: average repeated augmentations into
  # one cache key per support image, rather than using a 20N enlarged cache bank.
  CACHE_REPS: 20
  CACHE_TRAIN_AUG: true
  CACHE_AGGREGATION: mean
  CACHE_POOL_EPOCH_SUBSAMPLE: false

# Tip-Adapter-F in CLAP-style baselines is trained for 20 epochs.
# This is required for the repository-wide HPO path, because TIPA_F_GRID_EPOCHS
# is only used by the older internal grid-search runner, not by core/hpo.py.
OPTIM:
  MAX_EPOCH: 20

HPO:
  ENABLED: true
  SPLIT: val
  REQUIRE_VAL: true
  SELECTOR: acc
  ACC_TOLERANCE: 0.5

  SKIP_CANDIDATE_TEST: true
  FINAL_TEST_BEST: true
  TRAIN_FINAL_WITH_BEST: false
  COPY_BEST_MODEL: true
  SAVE_SUMMARY: true

  GRID:
    lr:
      PATH: OPTIM.LR
      VALUES: [0.1, 0.01]

    alpha:
      PATH: CLIP_ADAPTERS.TIPA_ALPHA
      VALUES: [1.0, 6.0, 11.0, 16.0, 21.0, 26.0, 31.0, 36.0, 41.0, 46.0]

    beta:
      PATH: CLIP_ADAPTERS.TIPA_BETA
      VALUES: [1.0, 3.8, 6.6, 9.4, 12.2, 15.0, 17.8, 20.6, 23.4, 26.2]
