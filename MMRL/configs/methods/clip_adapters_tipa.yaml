METHOD:
  NAME: ClipAdapters
  FAMILY: adapter
  TAG: TipA

CLIP_ADAPTERS:
  PREC: amp
  TYPE: MP
  INIT: TipA
  CONSTRAINT: none
  ENHANCED_BASE: none
  ALLOW_CACHE: true

  # CLAP-aligned TipA switches.
  CLAP_TIPA_TRAINABLE_CACHE: true
  CLAP_TIPA_RAW_AFFINITY: true
  CLAP_TIPA_ONE_EPOCH: true

  # Values overwritten by HPO candidates.
  TIPA_ALPHA: 1.0
  TIPA_BETA: 1.0

  # Important: for Tip-Adapter, repeated augmented support features should be
  # averaged before building the cache bank. Using pool creates 20N cache keys
  # and changes the scale/meaning of alpha and beta.
  CACHE_REPS: 20
  CACHE_TRAIN_AUG: true
  CACHE_AGGREGATION: mean
  CACHE_POOL_EPOCH_SUBSAMPLE: false

HPO:
  ENABLED: true
  SPLIT: val
  REQUIRE_VAL: true
  SELECTOR: acc
  ACC_TOLERANCE: 0.5

  SKIP_CANDIDATE_TEST: true
  FINAL_TEST_BEST: true
  TRAIN_FINAL_WITH_BEST: false
  COPY_BEST_MODEL: true
  SAVE_SUMMARY: true

  GRID:
    alpha:
      PATH: CLIP_ADAPTERS.TIPA_ALPHA
      VALUES: [1.0, 3.5, 6.0, 8.5, 11.0, 13.5, 16.0, 18.5, 21.0, 23.5, 26.0, 28.5, 31.0, 33.5, 36.0, 38.5, 41.0, 43.5, 46.0, 48.5]

    beta:
      PATH: CLIP_ADAPTERS.TIPA_BETA
      VALUES: [1.0, 2.4, 3.8, 5.2, 6.6, 8.0, 9.4, 10.8, 12.2, 13.6, 15.0, 16.4, 17.8, 19.2, 20.6, 22.0, 23.4, 24.8, 26.2, 27.6]
