METHOD:
  NAME: ClipAdapters
  FAMILY: adapter
  TAG: BAYES_ADAPTER

CLIP_ADAPTERS:
  PREC: amp
  TYPE: MP
  INIT: BAYES_ADAPTER
  CONSTRAINT: none
  ENHANCED_BASE: none
  ALLOW_CACHE: true

  # stochastic prototype sampling
  N_SAMPLES: 3
  N_TEST_SAMPLES: 20

  # BayesAdapter prior / KL
  BAYES_PRIOR_STD: 0.01
  BAYES_KL_SCALE: 1.0
  KL_WEIGHT: 0.0001

  # cache executor
  CACHE_REPS: 20
  CACHE_TRAIN_AUG: true
  CACHE_AGGREGATION: pool
  CACHE_POOL_EPOCH_SUBSAMPLE: true



HPO:
  ENABLED: true
  SPLIT: val
  REQUIRE_VAL: true
  SELECTOR: acc_ece_window
  ACC_TOLERANCE: 4.0

  SKIP_CANDIDATE_TEST: true
  FINAL_TEST_BEST: true
  TRAIN_FINAL_WITH_BEST: false
  COPY_BEST_MODEL: true
  SAVE_SUMMARY: true

  GRID:
    bayes_prior_std:
      PATH: CLIP_ADAPTERS.BAYES_PRIOR_STD
      VALUES: [0.001, 0.01, 0.1]
