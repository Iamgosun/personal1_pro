METHOD:
  NAME: "BayesRTMMRL"
  FAMILY: internal_adaptation
  EXEC_MODE: online

BAYESRT_MMRL:
  PREC: amp
  ALPHA: 0.7
  REG_WEIGHT: 0.5

# bayesrt_rpstd-0.001_rkl-1.0e-4_tpstd-0.001_tkl-5.0e-2_fusion-static_prob static_logit

  N_REP_TOKENS: 5
  REP_LAYERS: [6, 7, 8, 9, 10, 11, 12]
  REP_DIM: 512

  # R side: image representation branch projection P_v^r
  BAYES_R_ENABLED: True
  R_SIGMA_MODE: "output"          # global | input | output | diagonal
  R_PRIOR_MODE: "zero"         # zero | self_proj_rep
  R_PRIOR_STD: 0.001
  R_KL_WEIGHT: 1.0e-4

  # T side: fixed-mean text projection P_t
  BAYES_T_ENABLED: True
  T_SIGMA_MODE: "output"       # global | output | input | diagonal
  T_PRIOR_STD: 0.001
  T_MIN_SIGMA: 1.0e-6
  T_KL_WEIGHT: 5e-2

  # MC
  N_MC_TRAIN: 3
  N_MC_TEST: 30
  EVAL_USE_POSTERIOR_MEAN: False
  KL_WARMUP_EPOCHS: 5

  # Novel / new-task conservative path
  NOVEL_TEXT_MEAN_ONLY: True

  # Fusion
  REPORT_FUSION_VARIANTS: True

    # MC aggregation is now owned by EVAL_FUSION_VARIANT.
  # Do not pre-aggregate branches before fusion.
  #
  # Options:
  #   static_prob       : alpha * pbar_c + (1-alpha) * pbar_r
  #   static_logit      : alpha * mean_logit_c + (1-alpha) * mean_logit_r
  #   uncertainty_prob  : MI precision-weighted probability fusion
  #   poe_logprob       : old behavior, alpha * log(pbar_c) + (1-alpha) * log(pbar_r)
  EVAL_FUSION_VARIANT: "static_prob"



HPO:
  ENABLED: true
  SPLIT: val
  REQUIRE_VAL: true
  SELECTOR: acc_ece_window
  ACC_TOLERANCE: 4.0

  SKIP_CANDIDATE_TEST: true
  FINAL_TEST_BEST: true
  TRAIN_FINAL_WITH_BEST: false
  COPY_BEST_MODEL: true
  SAVE_SUMMARY: true

  GRID:
    r_prior_std:
      PATH: BAYESRT_MMRL.R_PRIOR_STD
      VALUES: [0.001,0.01]

    t_prior_std:
      PATH: BAYESRT_MMRL.T_PRIOR_STD
      VALUES: [0.001,0.01]

    eval_fusion_variant:
      PATH: BAYESRT_MMRL.EVAL_FUSION_VARIANT
      VALUES: [ "static_prob" , "static_logit"]