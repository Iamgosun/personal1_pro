METHOD:
  NAME: "BayesRTMMRL"
  FAMILY: internal_adaptation
  EXEC_MODE: online

BAYESRT_MMRL:
  PREC: amp
  ALPHA: 0.7
  REG_WEIGHT: 0.5

  N_REP_TOKENS: 5
  REP_LAYERS: [6, 7, 8, 9, 10, 11, 12]
  REP_DIM: 512

  # R side: image representation branch projection P_v^r
  BAYES_R_ENABLED: True
  R_SIGMA_MODE: "row"          # global | row | col | diagonal
  R_PRIOR_MODE: "zero"         # zero | self_proj_rep
  R_PRIOR_STD: 0.01
  R_KL_WEIGHT: 1.0e-6

  # T side: fixed-mean text projection P_t
  BAYES_T_ENABLED: True
  T_SIGMA_MODE: "output"       # global | output | input | diagonal
  T_PRIOR_STD: 0.003
  T_MIN_SIGMA: 1.0e-6
  T_KL_WEIGHT: 1.0e-2

  # MC
  N_MC_TRAIN: 3
  N_MC_TEST: 30
  EVAL_USE_POSTERIOR_MEAN: False
  EVAL_AGGREGATION: "prob_mean"  # prob_mean | logit_mean

  KL_WARMUP_EPOCHS: 5

  # Novel / new-task conservative path
  NOVEL_TEXT_MEAN_ONLY: True

  # Fusion
  REPORT_FUSION_VARIANTS: True
  EVAL_FUSION_VARIANT: "static"  # static | uncertainty