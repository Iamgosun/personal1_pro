METHOD:
  NAME: "DetBayesRTMMRL"
  FAMILY: internal_adaptation
  EXEC_MODE: online

BAYESRT_MMRL:
  PREC: amp
  ALPHA: 0.7
  REG_WEIGHT: 0.5

  N_REP_TOKENS: 5
  REP_LAYERS: [6, 7, 8, 9, 10, 11, 12]
  REP_DIM: 512

  # R side: image representation branch projection P_v^r
  BAYES_R_ENABLED: True
  R_SIGMA_MODE: "output"      # global | input | output | diagonal
  R_PRIOR_MODE: "random_mmrl"        # zero | self_proj_rep
  R_PRIOR_STD: 0.001
  R_KL_WEIGHT: 1.0e-4

  # T side: text projection P_t
  BAYES_T_ENABLED: True
  T_SIGMA_MODE: "output"      # global | output | input | diagonal
  T_PRIOR_STD: 0.001
  T_MIN_SIGMA: 1.0e-6
  T_KL_WEIGHT: 5.0e-2
  T_TRAIN_MEAN: False

  # MC is still used for evaluation. Training is sampling-free in DetBayesRTMMRL.
  N_MC_TRAIN: 3
  N_MC_TEST: 30
  EVAL_USE_POSTERIOR_MEAN: False
  KL_WARMUP_EPOCHS: 5


  # R_PRIOR_STD: 
  # R_KL_WEIGHT: 
  # T_PRIOR_STD: 
  # T_KL_WEIGHT: 
  # EVAL_FUSION_VARIANT:


  
  # Optional Det-Jensen hyperparameters.
  # These are read by getattr() in the new method. If your YACS config rejects
  # unknown keys, remove these three lines and the code will use defaults:
  # DET_VAR_SCALE=0.5, DET_VAR_CLAMP=20.0, DET_MOMENT_EPS=1e-6.
  # DET_VAR_SCALE: 0.5
  # DET_VAR_CLAMP: 20.0
  # DET_MOMENT_EPS: 1.0e-6
  # LOGIT_SCALE: 100.0

  NOVEL_TEXT_MEAN_ONLY: True
  REPORT_FUSION_VARIANTS: True
  EVAL_FUSION_VARIANT: "static_logit"

HPO:
  ENABLED: false
  SPLIT: val
  REQUIRE_VAL: true
  SELECTOR: acc_ece_window
  ACC_TOLERANCE: 4.0

  SKIP_CANDIDATE_TEST: true
  FINAL_TEST_BEST: true
  TRAIN_FINAL_WITH_BEST: false
  COPY_BEST_MODEL: true
  SAVE_SUMMARY: true

  GRID:
    r_prior_std:
      PATH: BAYESRT_MMRL.R_PRIOR_STD
      VALUES: [0.001, 0.1]

    t_prior_std:
      PATH: BAYESRT_MMRL.T_PRIOR_STD
      VALUES: [0.001, 0.1]


    t_prior_std:
      PATH: BAYESRT_MMRL.T_PRIOR_STD
      VALUES: [0.001, 0.1]


    eval_fusion_variant:
      PATH: BAYESRT_MMRL.EVAL_FUSION_VARIANT
      VALUES: ["static_prob", "static_logit"]
