METHOD:
  NAME: "BayesTextMMRL"
  FAMILY: internal_adaptation
  EXEC_MODE: online

BAYES_TEXT_MMRL:
  PREC: amp
  ALPHA: 0.7
  REG_WEIGHT: 0.5

  N_REP_TOKENS: 5
  REP_LAYERS: [6, 7, 8, 9, 10, 11, 12]
  REP_DIM: 512

  N_MC_TRAIN: 3
  N_MC_TEST: 30
  EVAL_USE_POSTERIOR_MEAN: False
  EVAL_AGGREGATION: "prob_mean"  # prob_mean | logit_mean

  TEXT_PRIOR_STD: 0.05
  TEXT_MIN_SIGMA: 1.0e-6
  TEXT_KL_WEIGHT: 1.0e-2
  KL_WARMUP_EPOCHS: 5